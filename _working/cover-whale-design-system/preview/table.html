<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Table</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; border:1px solid #EDEBF2; border-radius:8px; overflow:hidden;">
  <div style="display:flex; padding:12px 16px; background:#F8F7FA; font:600 12px/16px Inter; color:#66636E; text-transform:uppercase; letter-spacing:0.04em;">
    <span style="width:96px;">DOT</span>
    <span style="flex:1;">Legal Name</span>
    <span style="width:130px;">Status</span>
    <span style="width:90px; text-align:right;">Action</span>
  </div>
  
    <div style="display:flex; padding:12px 16px; align-items:center; border-top:1px solid #EDEBF2; font:500 14px/20px Inter; color:#15121A;">
      <span style="width:96px; font-variant-numeric:tabular-nums;">2537062</span>
      <span style="flex:1;">SOHIO EXPEDITING LLC</span>
      <span style="width:130px;"><span style="display:inline-flex; align-items:center; height:22px; padding:0 10px; background:#D99FFF; color:#5B0D80; border-radius:4px; font:500 12px/16px Inter;">Bindable</span></span>
      <span style="width:90px; text-align:right; color:#81369F; font-weight:500;">Review</span>
    </div>
    <div style="display:flex; padding:12px 16px; align-items:center; border-top:1px solid #EDEBF2; font:500 14px/20px Inter; color:#15121A;">
      <span style="width:96px; font-variant-numeric:tabular-nums;">2464946</span>
      <span style="flex:1;">OHIO VALLEY SAND LLC</span>
      <span style="width:130px;"><span style="display:inline-flex; align-items:center; height:22px; padding:0 10px; background:#29CC96; color:#15121A; border-radius:4px; font:500 12px/16px Inter;">Bound</span></span>
      <span style="width:90px; text-align:right; color:#81369F; font-weight:500;">Review</span>
    </div>
    <div style="display:flex; padding:12px 16px; align-items:center; border-top:1px solid #EDEBF2; font:500 14px/20px Inter; color:#15121A;">
      <span style="width:96px; font-variant-numeric:tabular-nums;">1674219</span>
      <span style="flex:1;">SCHRAMKE ENTERPRISES</span>
      <span style="width:130px;"><span style="display:inline-flex; align-items:center; height:22px; padding:0 10px; background:#F5CF47; color:#4A3C00; border-radius:4px; font:500 12px/16px Inter;">UW Review</span></span>
      <span style="width:90px; text-align:right; color:#81369F; font-weight:500;">Review</span>
    </div>
    <div style="display:flex; padding:12px 16px; align-items:center; border-top:1px solid #EDEBF2; font:500 14px/20px Inter; color:#15121A;">
      <span style="width:96px; font-variant-numeric:tabular-nums;">3873596</span>
      <span style="flex:1;">MILESTONE TRANSPORTATION</span>
      <span style="width:130px;"><span style="display:inline-flex; align-items:center; height:22px; padding:0 10px; background:#FFE6E6; color:#CC3D3D; border-radius:4px; font:500 12px/16px Inter;">Declined</span></span>
      <span style="width:90px; text-align:right; color:#81369F; font-weight:500;">Review</span>
    </div>
</div>
</body>
</html>
