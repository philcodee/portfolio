<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Verify chips</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 24px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; display:flex; gap:10px; align-items:center;">
  <span style="display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 12px 0 8px; background:#F2FFF8; color:#004D33; border:1px solid #29CC96; border-radius:4px; font:500 14px/24px Inter;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#004D33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l3 3 7-7"/></svg>Verified</span>
  <span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#F8F7FA; color:#66636E; border-radius:4px; font:500 14px/24px Inter;">Verify now</span>
  <span style="display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 12px 0 8px; background:#F2FFF8; color:#004D33; border:1px solid #29CC96; border-radius:4px; font:500 14px/24px Inter;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#004D33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l3 3 7-7"/></svg>Verify</span>
</div>
</body>
</html>
