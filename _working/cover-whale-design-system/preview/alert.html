<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Alerts</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; display:flex; flex-direction:column; gap:8px;">
  <div style="display:flex; gap:12px; padding:12px 16px; background:#F2FFF8; border:1px solid #29CC96; border-radius:8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#004D33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>
    <div><div style="font:600 14px/20px Inter; color:#004D33;">Quote bound successfully</div><div style="font:400 13px/20px Inter; color:#004D33;">Policy CW-198123 will go in-force on 06/01.</div></div>
  </div>
  <div style="display:flex; gap:12px; padding:12px 16px; background:#FFE6E6; border:1px solid #CC3D3D; border-radius:8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#CC3D3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17v.01"/></svg>
    <div><div style="font:600 14px/20px Inter; color:#CC3D3D;">Submission declined</div><div style="font:400 13px/20px Inter; color:#CC3D3D;">DOT inactive for 90+ days on FMCSA.</div></div>
  </div>
</div>
</body>
</html>
