<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Text fields</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; display:flex; gap:14px; align-items:flex-end;">
  <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
    <label style="font:400 14px/24px Inter; color:#66636E;">DOT Number</label>
    <div style="height:40px; padding:0 14px; border:1px solid #C4C0CF; border-radius:4px; background:#fff; display:flex; align-items:center; font:400 14px/24px Inter; color:#9794A2;">Enter</div>
    <span style="font:400 12px/16px Inter; color:#66636E;">As appears on FMCSA/SAFER.</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
    <label style="font:400 14px/24px Inter; color:#66636E;">Legal Name</label>
    <div style="height:40px; padding:0 14px; border:1px solid #81369F; border-radius:4px; background:#fff; display:flex; align-items:center; font:500 14px/24px Inter; color:#15121A; box-shadow:0 0 0 2px rgba(129,54,159,0.18);">Warehouse 2 Warehouse, LLC</div>
    <span style="font:400 12px/16px Inter; color:#66636E;">As appears on FMCSA/SAFER.</span>
  </div>
  <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
    <label style="font:400 14px/24px Inter; color:#CC3D3D;">Email address*</label>
    <div style="height:40px; padding:0 14px; border:1px solid #CC3D3D; border-radius:4px; background:#fff; display:flex; align-items:center; font:400 14px/24px Inter; color:#9794A2;">&nbsp;</div>
    <span style="font:400 12px/16px Inter; color:#CC3D3D;">Please fill out this field.</span>
  </div>
</div>
</body>
</html>
