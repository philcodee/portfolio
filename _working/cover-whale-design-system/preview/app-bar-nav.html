<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>App bar & nav</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; border:1px solid #EDEBF2; border-radius:8px; overflow:hidden;">
  <div style="height:56px; background:#fff; border-bottom:1px solid #EDEBF2; display:flex; align-items:center; padding:0 16px; gap:16px;">
    <img src="../assets/cover-whale-wordmark.svg" alt="" height="22" />
    <div style="flex:1; max-width:380px; height:32px; background:#F8F7FA; border-radius:4px; display:flex; align-items:center; padding:0 12px; gap:8px; color:#9794A2; font:400 13px/20px Inter;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9794A2" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</div>
    <div style="flex:1;"></div>
    <button style="height:32px; padding:0 14px; background:#81369F; color:#fff; border:none; border-radius:4px; font:500 13px/20px Inter;">New Quote</button>
    <div style="width:32px; height:32px; border-radius:16px; background:#EDEBF2; display:flex; align-items:center; justify-content:center; font:600 12px/16px Inter; color:#484452;">PC</div>
  </div>
  <div style="display:flex; min-height:140px;">
    <div style="width:200px; background:#fff; border-right:1px solid #EDEBF2; padding:12px 8px; display:flex; flex-direction:column; gap:2px;">
      
        <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:4px; background:#FBF2FF; color:#81369F; font:500 14px/20px Inter;">
          <span style="width:18px; height:18px; border-radius:3px; background:#81369F;"></span>Dashboard
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:4px; color:#15121A; font:500 14px/20px Inter;">
          <span style="width:18px; height:18px; border-radius:3px; background:#C4C0CF;"></span>Submissions
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:4px; color:#15121A; font:500 14px/20px Inter;">
          <span style="width:18px; height:18px; border-radius:3px; background:#C4C0CF;"></span>Quotes
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:4px; color:#15121A; font:500 14px/20px Inter;">
          <span style="width:18px; height:18px; border-radius:3px; background:#C4C0CF;"></span>Policies
        </div>
        <div style="display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:4px; color:#15121A; font:500 14px/20px Inter;">
          <span style="width:18px; height:18px; border-radius:3px; background:#C4C0CF;"></span>Messages
        </div>
    </div>
    <div style="flex:1; background:#F8F7FA;"></div>
  </div>
</div>
</body>
</html>
