<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Status chips</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; display:flex; flex-wrap:wrap; gap:8px;">
  <span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#29CC96; color:#15121A; border-radius:4px; font:500 12px/16px Inter;">Bound</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#D99FFF; color:#5B0D80; border-radius:4px; font:500 12px/16px Inter;">Quoted</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#F5CF47; color:#4A3C00; border-radius:4px; font:500 12px/16px Inter;">Underwriting Review</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#EBEEFF; color:#061459; border-radius:4px; font:500 12px/16px Inter;">In Progress</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#FFEDE2; color:#BB4F09; border-radius:4px; font:500 12px/16px Inter;">Cancel Requested</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#FFEDE2; color:#BB4F09; border-radius:4px; font:500 12px/16px Inter;">Pending Cancellation</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#EDEBF2; color:#484452; border-radius:4px; font:500 12px/16px Inter;">Cancelled</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#FFE6E6; color:#CC3D3D; border-radius:4px; font:500 12px/16px Inter;">Declined</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#F8F7FA; color:#66636E; border-radius:4px; font:500 12px/16px Inter;">Expired</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#F8F7FA; color:#66636E; border-radius:4px; font:500 12px/16px Inter;">Not Taken Up</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#81369F; color:#fff; border-radius:4px; font:500 12px/16px Inter;">Brand</span><span style="display:inline-flex; align-items:center; height:24px; padding:0 12px; background:#3F51B5; color:#fff; border-radius:4px; font:500 12px/16px Inter;">Info</span>
</div>
</body>
</html>
