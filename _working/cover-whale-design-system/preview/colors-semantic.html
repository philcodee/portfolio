<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Semantic surface</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div class="col" style="gap:6px;">
  <div class="row">
    <div style="flex:1; height:54px; background:#FFFFFF; border:1px solid #EDEBF2; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">surface-primary<br><span class="label-sm">#FFFFFF</span></div>
    <div style="flex:1; height:54px; background:#F8F7FA; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">surface-secondary<br><span class="label-sm">#F8F7FA</span></div>
    <div style="flex:1; height:54px; background:#EDEBF2; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">surface-contrast<br><span class="label-sm">#EDEBF2</span></div>
    <div style="flex:1; height:54px; background:#15121A; color:#fff; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">surface-invert<br><span class="label-sm" style="color:#C4C0CF;">#15121A</span></div>
  </div>
  <div class="row">
    <div style="flex:1; height:54px; background:#81369F; color:#fff; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">brand-primary<br><span class="label-sm" style="color:#FBF2FF;">#81369F</span></div>
    <div style="flex:1; height:54px; background:#D99FFF; color:#5B0D80; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">brand-secondary<br><span class="label-sm" style="color:#5B0D80;">#D99FFF</span></div>
    <div style="flex:1; height:54px; background:#5B0D80; color:#fff; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">brand-contrast<br><span class="label-sm" style="color:#D99FFF;">#5B0D80</span></div>
    <div style="flex:1; height:54px; background:#32004B; color:#fff; border-radius:6px; padding:8px 10px; font:500 12px/14px Inter;">brand-heavy<br><span class="label-sm" style="color:#D99FFF;">#32004B</span></div>
  </div>
</div>
</body>
</html>
