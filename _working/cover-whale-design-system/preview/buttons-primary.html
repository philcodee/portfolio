<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Primary buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 24px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; display:flex; flex-direction:column; gap:14px;">
  <div style="display:flex; gap:10px; align-items:center;">
    <button style="height:36px; padding:0 16px; background:#81369F; color:#fff; border:none; border-radius:4px; font:500 14px/24px Inter; cursor:pointer; display:inline-flex; align-items:center; gap:8px;"><span style="font-size:14px;">＋</span>Add Additional Insured</button>
    <button style="height:36px; padding:0 16px; background:#5B0D80; color:#fff; border:none; border-radius:4px; font:500 14px/24px Inter;">Hover</button>
    <button style="height:36px; padding:0 16px; background:#32004B; color:#fff; border:none; border-radius:4px; font:500 14px/24px Inter;">Pressed</button>
    <button style="height:36px; padding:0 16px; background:#F8F7FA; color:#484452; border:none; border-radius:4px; font:500 14px/24px Inter;">Disabled</button>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button style="height:32px; padding:0 12px; background:#81369F; color:#fff; border:none; border-radius:4px; font:500 13px/20px Inter;">Small</button>
    <button style="height:36px; padding:0 16px; background:#81369F; color:#fff; border:none; border-radius:4px; font:500 14px/24px Inter;">Default</button>
    <button style="height:44px; padding:0 24px; background:#81369F; color:#fff; border:none; border-radius:4px; font:500 16px/24px Inter;">Large</button>
  </div>
</div>
</body>
</html>
