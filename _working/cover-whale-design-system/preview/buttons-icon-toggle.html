<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Icon & toggle</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { padding: 24px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .swatch { flex: 1; min-width: 0; height: 100px; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500; line-height: 14px; }
  .swatch .name { font-weight: 600; font-size: 13px; }
  .swatch .hex  { opacity: 0.75; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label-sm { color: var(--cw-text-secondary); font: 500 11px/14px 'Inter', sans-serif; }
  .pip { width: 32px; height: 32px; border-radius: 6px; }
  .specimen-row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--cw-border-primary); }
  .specimen-row:last-child { border-bottom: 0; }
  .specimen-token { width: 92px; color: var(--cw-text-secondary); font: 500 12px/16px 'Inter', sans-serif; flex-shrink: 0; }
  .specimen-size  { width: 44px; color: var(--cw-text-secondary); font: 500 11px/16px 'Inter', sans-serif; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .specimen-text  { color: var(--cw-text-primary); font-family: 'Inter', sans-serif; }
</style>
</head>
<body>

<div style="font-family:Inter; display:flex; gap:24px; align-items:center;">
  <div style="display:flex; gap:8px;">
    <button title="Refresh" style="width:32px; height:32px; background:transparent; border:none; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15121A" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button title="Refresh hover" style="width:32px; height:32px; background:#EDEBF2; border:none; border-radius:4px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15121A" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button title="Close on purple" style="width:36px; height:48px; background:#81369F; border:none; border-radius:4px; box-shadow:0 0 38px 32px rgba(0,0,0,0.04); display:flex; align-items:center; justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M6 18 18 6"/></svg></button>
  </div>
  <div style="display:flex; padding:4px; border:1px solid #EDEBF2; border-radius:4px; background:#fff; box-shadow:inset 0 0 4px 0 rgba(0,0,0,0.12); gap:4px;">
    <button style="height:32px; padding:0 12px; background:#29CC96; color:#15121A; border:none; border-radius:4px; font:700 14px/24px Inter;">Included</button>
    <button style="height:32px; padding:0 12px; background:#fff; color:#66636E; border:none; border-radius:4px; font:700 14px/24px Inter;">Excluded</button>
  </div>
</div>
</body>
</html>
